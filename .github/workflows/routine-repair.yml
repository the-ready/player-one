name: 週次収集の自動修復

# weekly-collect.yml の実行が success 以外で終わったときだけ発火する。
# ここでは Claude を起動しない。同じ Pi・同じ working directory に残っている
# 失敗回のdata/・temp/・.claude/logs/ に対して、機械的な後始末（prev_rows --carry-rest・
# purge_ended・validate_data・diff_data）だけをやり直す（docs/DESIGN.md 第13.4節）。
#
# ============================================================
# actions/checkout をあえて呼ばない理由
# ============================================================
# actions/checkout は `clean: false` を指定しても、対象refへの `git checkout --force`
# 自体は必ず実行する。--force は追跡ファイルの未コミットの変更を問答無用で
# 破棄するため、weekly-collect.yml が強制終了された回の「書きかけのdata/*.csv」も
# 一緒に失われてしまう——救い出したいものをcheckout自身が消してしまう形になる。
#
# self-hosted runner は使い捨てではなく、直前の weekly-collect.yml ジョブが残した
# working directory（$GITHUB_WORKSPACE）がそのまま次のジョブにも引き継がれるため、
# ここでは checkout を呼ばず、直前のジョブが残した状態にそのまま触る。
# git の認証情報だけは checkout がやっていたことを手で再現する
# （前ジョブのGITHUB_TOKENは既に失効しているため、このジョブ自身のトークンで張り直す）。

# weekly-collect.yml の起動元は Pi のタイマー（PAT）か人の手動実行だけなので、
# その完了は必ず workflow_run を発火する。かつて代理起動（GITHUB_TOKEN 起点）の回を
# 拾うために毎日の schedule を置いていたが、代理起動そのものを廃止したため不要になった
# （docs/DESIGN.md 第13.3節）。
on:
  workflow_run:
    workflows: ["週次データ収集"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: weekly-routine
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # 修復成功後に pages.yml を直接 workflow_dispatch するために要る（下の
  # 「公開を明示的に起動する」ステップ。docs/DESIGN.md 第13.2節）。
  actions: write

jobs:
  repair:
    # workflow_run 以外（手動実行）は無条件で見にいく。実際に直すものが
    # あるかどうかは repair-routine.sh 自身が data/ docs/ の差分の有無で判断する。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: [self-hosted, player-one-pi]
    timeout-minutes: 30
    steps:
      - name: git の push 認証を張り直す
        # actions/checkout が内部で使っているのと同じ方式（x-access-token を
        # Basic認証としてextraheaderに設定する）。checkoutを呼ばない分だけ、
        # ここで自分のトークンに張り替えておく必要がある。
        run: |
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(echo -n "x-access-token:${{ github.token }}" | base64 -w0)"

      - name: 実行前のHEADを記録する
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 機械的な修復を実行
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
          FAILED_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: .claude/scripts/repair-routine.sh

      # weekly-collect.yml と同じ理由（docs/DESIGN.md 第13.2節）。この実行自体が
      # workflow_run で起動されており、workflow_run 起動の実行が push できても
      # さらに次の workflow_run（pages.yml）を発火する保証が無いため、直接起動する。
      # repair-routine.sh は「直すものが無かった」回も exit 0 で終えるため、
      # HEAD が動いていない＝実際には push していない回まで毎回デプロイし直さないよう、
      # コミットが増えたときだけ起動する。
      - name: 公開を明示的に起動する
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BEFORE_SHA" ]; then
            echo "新しいコミットが無いため、デプロイの起動をスキップします"
            exit 0
          fi
          code="$(curl -sS -o /tmp/pages-dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [ "$code" != "204" ]; then
            echo "::warning::pages.yml の再デプロイ起動に失敗しました (HTTP $code)"
            cat /tmp/pages-dispatch-response.txt
          fi

      # 機械的な修復の次の一手として、原因の自動調査を起動する（第13.9節）。
      # **起動元がここにあるのは、順序を保証するためである。** investigate は
      # actions/checkout（--force を伴う）を行うので、repair が書きかけの data/ を
      # 救い出す前に走ると、救えたはずの回を落とす。repair の最終ステップから
      # dispatch すれば、repair が concurrency group を保持したまま investigate が
      # 1つだけ pending に入り、repair の完了後に確実に走る。
      #
      # always() なのは、repair-routine.sh が失敗した回こそ調べたいためである。
      # workflow_run の回に限るのは、手動実行（動作確認や取りこぼしの回収）から
      # 調査まで巻き込んで Claude を起こす理由が無いためである
      # （このジョブ自体、workflow_run では conclusion != success のときしか動かない）。
      - name: 失敗の調査を明示的に起動する
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_NAME: ${{ github.event.workflow_run.name }}
        run: |
          # 値は環境変数で渡して python に組み立てさせる。ワークフロー名などを
          # シェルの文字列連結で JSON に埋めると、引用符を含む値で壊れる。
          # 1行に収めているのは、YAML のブロックスカラーの中で列0から書いた行が
          # ブロックを抜けてしまい、ワークフロー全体が構文エラーになるためである。
          payload="$(python3 -c 'import json, os; print(json.dumps({"ref": "main", "inputs": {"failed_run_url": os.environ.get("RUN_URL", ""), "failed_run_conclusion": os.environ.get("CONCLUSION", ""), "failed_run_name": os.environ.get("WF_NAME", "")}}))')"
          code="$(curl -sS -o /tmp/investigate-dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/routine-investigate.yml/dispatches" \
            -d "$payload")"
          if [ "$code" != "204" ]; then
            echo "::warning::routine-investigate.yml の起動に失敗しました (HTTP $code)"
            cat /tmp/investigate-dispatch-response.txt
          fi

      - name: 修復ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-log-${{ github.run_id }}
          path: .claude/logs/repair_*.log
          retention-days: 30
          if-no-files-found: ignore
