name: 週次収集の自動修復

# weekly-collect.yml の実行が success 以外で終わったときだけ発火する。
# ここでは Claude を起動しない。同じ Pi・同じ working directory に残っている
# 失敗回のdata/・temp/・.claude/logs/ に対して、機械的な後始末（prev_rows --carry-rest・
# purge_ended・validate_data・diff_data）だけをやり直す（docs/DESIGN.md 第13.4節）。
#
# ============================================================
# actions/checkout をあえて呼ばない理由
# ============================================================
# actions/checkout は `clean: false` を指定しても、対象refへの `git checkout --force`
# 自体は必ず実行する。--force は追跡ファイルの未コミットの変更を問答無用で
# 破棄するため、weekly-collect.yml が強制終了された回の「書きかけのdata/*.csv」も
# 一緒に失われてしまう——救い出したいものをcheckout自身が消してしまう形になる。
#
# self-hosted runner は使い捨てではなく、直前の weekly-collect.yml ジョブが残した
# working directory（$GITHUB_WORKSPACE）がそのまま次のジョブにも引き継がれるため、
# ここでは checkout を呼ばず、直前のジョブが残した状態にそのまま触る。
# git の認証情報だけは checkout がやっていたことを手で再現する
# （前ジョブのGITHUB_TOKENは既に失効しているため、このジョブ自身のトークンで張り直す）。

on:
  workflow_run:
    workflows: ["週次データ収集"]
    types: [completed]
  # weekly-collect.yml が GITHUB_TOKEN による workflow_dispatch（collect-fallback.yml
  # からの代理起動）で始まった回は、失敗して終わってもこの workflow_run が発火しない
  # （第13.2節と同じ「GITHUB_TOKEN起点のイベント連鎖はさらに連鎖しない」仕様のため）。
  # その回だけ後始末が永遠に走らない穴を塞ぐため、毎日1回、data/ docs/ に未コミットの
  # 変更が残っていないかを直接確かめにいく。直すものが無ければ repair-routine.sh は
  # 何もせず終わるので、通常日はほぼ何もしないコストの軽い保険である
  # （docs/routine-postmortems.md 2026-09-24）。
  schedule:
    - cron: "15 21 * * *" # 毎日 06:15 JST。20時間遅れの代理起動が終わる時間帯より後
  workflow_dispatch:

concurrency:
  group: weekly-routine
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # 修復成功後に pages.yml を直接 workflow_dispatch するために要る（下の
  # 「公開を明示的に起動する」ステップ。docs/DESIGN.md 第13.2節）。
  actions: write

jobs:
  repair:
    # workflow_run 以外（schedule・手動実行）は無条件で見にいく。実際に直すものが
    # あるかどうかは repair-routine.sh 自身が data/ docs/ の差分の有無で判断する。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: [self-hosted, player-one-pi]
    timeout-minutes: 30
    steps:
      - name: git の push 認証を張り直す
        # actions/checkout が内部で使っているのと同じ方式（x-access-token を
        # Basic認証としてextraheaderに設定する）。checkoutを呼ばない分だけ、
        # ここで自分のトークンに張り替えておく必要がある。
        run: |
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(echo -n "x-access-token:${{ github.token }}" | base64 -w0)"

      - name: 実行前のHEADを記録する
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 機械的な修復を実行
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
          FAILED_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: .claude/scripts/repair-routine.sh

      # weekly-collect.yml と同じ理由（docs/DESIGN.md 第13.2節）。この実行自体が
      # workflow_run で起動されており、workflow_run 起動の実行が push できても
      # さらに次の workflow_run（pages.yml）を発火する保証が無いため、直接起動する。
      # repair-routine.sh は「直すものが無かった」回も exit 0 で終える（schedule での
      # 毎日の巡回はほとんどがこれに当たる）。HEAD が動いていない＝実際には push して
      # いない回まで毎回デプロイし直さないよう、コミットが増えたときだけ起動する。
      - name: 公開を明示的に起動する
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BEFORE_SHA" ]; then
            echo "新しいコミットが無いため、デプロイの起動をスキップします"
            exit 0
          fi
          code="$(curl -sS -o /tmp/pages-dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [ "$code" != "204" ]; then
            echo "::warning::pages.yml の再デプロイ起動に失敗しました (HTTP $code)"
            cat /tmp/pages-dispatch-response.txt
          fi

      - name: 修復ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-log-${{ github.run_id }}
          path: .claude/logs/repair_*.log
          retention-days: 30
          if-no-files-found: ignore
