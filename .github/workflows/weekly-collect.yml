name: 週次データ収集

# 実行は Raspberry Pi 4 が self-hosted runner として行う。このワークフローは
# `.claude/scripts/claude-routine.sh` を起動するだけで、収集の中身（曜日→スキルの対応・
# 波の分け方・検証・push の可否）はスクリプトの側が持つ。詳しくは docs/DESIGN.md 第13章。
#
# 曜日→スキルの対応は `.claude/skills/weekly-routine/SKILL.md` の ```schedule ブロックが
# 正本で、このワークフローは持たない（claude-routine.sh がそこを読む）。

on:
  # schedule は持たない。GitHub Actions の schedule は数時間遅れることがあるため
  # （2026-09-22 は2時間46分）、起動はすべて workflow_dispatch で受ける（docs/DESIGN.md 第13.3節）:
  #   - 水木金 02:30 JST: Raspberry Pi の systemd タイマー（.claude/systemd/player-one-dispatch.timer）
  #   - タイマーが起動しなかった枠: 予備の collect-fallback.yml（hosted runner）が遅れて代わりに起動
  #   - 任意の曜日の手動実行（シミュレーション）
  # 自動実行は水木金だけで、`.claude/skills/weekly-routine/SKILL.md` の```schedule ブロックの
  # `other` 行は手動実行したときの既定値として存在する。
  workflow_dispatch:
    inputs:
      routine_skill:
        description: "実行するスキルを固定する（(自動選択)なら曜日から選ぶ）"
        required: false
        type: choice
        options:
          - "(自動選択)"
          - kanto-event-collector
          - kanto-live-collector
          - kanto-movie-collector
        default: "(自動選択)"
      push:
        description: "検証を通った回を実際に push する"
        required: false
        type: boolean
        default: true

# 同じ Pi 上で weekly-collect と routine-repair を同時に走らせない。
# self-hosted runner は既定で直列実行だが、それとは別に「同じ作業ツリーを
# 2つのワークフローが同時にいじらない」という意図をここに明示しておく
# （routine-repair.yml も同じグループ名を使う）。
concurrency:
  group: weekly-routine
  cancel-in-progress: false

permissions:
  contents: write
  # 収集成功後に pages.yml を直接 workflow_dispatch するために要る（下の
  # 「公開を明示的に起動する」ステップ。docs/DESIGN.md 第13.2節）。
  actions: write

jobs:
  collect:
    runs-on: [self-hosted, player-one-pi]
    # Actions 側のジョブ上限（hosted runner の6時間相当の目安を踏襲）より
    # 少し短く切って、内側の claude-routine.sh 自身のタイムアウトが必ず先に
    # 発火するようにする。外側で強制終了されると検証・push・ログの整理が
    # 一切できないまま終わり、routine-repair.yml 任せになってしまうため
    # （そちらは「機械的な後始末」しかしない設計。docs/DESIGN.md 第13.4節）。
    timeout-minutes: 340
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 既定の clean:true は git clean -ffdx を実行し、.gitignore 対象の
          # .claude/logs/・data/.prev/・data/.robots/・data/.run/ も含めて
          # 未追跡ファイルを毎回消してしまう。ログの蓄積や前回分の退避を
          # 失いたくないので、このrunner専用の作業ツリーでは明示的に無効化する
          # （追跡ファイルの内容は checkout が通常どおり origin の状態へ揃える。
          # 影響するのは「未追跡ファイルを消すか」だけ）。
          clean: false

      - name: 週次ルーチンを実行
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-routine.sh 自身のタイムアウト（秒）。上の timeout-minutes より
          # 余裕を持って短く（5時間）——超過後も検証・push・ログ整理の時間を残す。
          ROUTINE_TIMEOUT_SEC: "18000"
          ROUTINE_PUSH: ${{ (github.event.inputs.push == 'false') && '0' || '1' }}
          # 「(自動選択)」を空文字列に読み替えたい場合、`cond && '' || x` という書き方は
          # 使えない——空文字列はfalsyなので && が真になっても直後の || がそれを
          # 飛び越して x 側を返してしまう（実際にこの書き方で「(自動選択)」という
          # 文字列がそのままROUTINE_SKILLに渡り、対応表に無い値としてdieする不具合を
          # シミュレーションで検出した）。真の枝が常に非空文字列になるよう、
          # 「3つの実在スキルのどれかに含まれるか」で判定する形にしている。
          ROUTINE_SKILL: ${{ contains(fromJSON('["kanto-event-collector","kanto-live-collector","kanto-movie-collector"]'), github.event.inputs.routine_skill) && github.event.inputs.routine_skill || '' }}
        run: .claude/scripts/claude-routine.sh

      # pages.yml の workflow_run トリガーは、この実行自体が GITHUB_TOKEN による
      # workflow_dispatch（＝collect-fallback.yml からの代理起動）で始まっていると
      # 発火しない（GITHUB_TOKEN起点のイベント連鎖を止める仕様が、workflow_dispatch
      # 自身の「新しい実行は作れる」という例外を通り抜けたあとの完了通知には及ばない
      # ため。docs/DESIGN.md 第13.2節）。2026-09-24、代理起動された回のpushが
      # デプロイされない事故として実際に発生した。workflow_run に頼らず、
      # 成功したこのジョブ自身が pages.yml を直接 workflow_dispatch する
      # （このAPI呼び出し自体はGITHUB_TOKENでも新しい実行を作れる。上と同じ例外）。
      - name: 公開を明示的に起動する
        if: success() && github.event.inputs.push != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -sS -o /tmp/pages-dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [ "$code" != "204" ]; then
            echo "::warning::pages.yml の再デプロイ起動に失敗しました (HTTP $code)"
            cat /tmp/pages-dispatch-response.txt
          fi

      - name: 実行ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routine-log-${{ github.run_id }}
          path: .claude/logs/routine_*.log
          retention-days: 30
          if-no-files-found: ignore
